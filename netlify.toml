[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # URL e chave PUBLICÁVEL do Supabase: são públicas por desenho (vão dentro do site);
  # quem protege os dados são o login e as regras de acesso do banco.
  VITE_SUPABASE_URL = "https://sirhttnpwcoptezpxneb.supabase.co"
  VITE_SUPABASE_KEY = "sb_publishable_UbOVpNpgKeT579o63MrG4w_Z92CSWMo"

# Cabeçalhos de segurança do site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    # Só carrega do próprio site, do Supabase (dados, login, tempo real), da BrasilAPI (busca de CNPJ) e das fontes do Google.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://sirhttnpwcoptezpxneb.supabase.co wss://sirhttnpwcoptezpxneb.supabase.co https://brasilapi.com.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
