[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # URL e chave PUBLICÁVEL do Supabase: são públicas por desenho (vão dentro do site);
  # quem protege os dados são o login e as regras de acesso do banco.
  VITE_SUPABASE_URL = "https://sirhttnpwcoptezpxneb.supabase.co"
  VITE_SUPABASE_KEY = "sb_publishable_UbOVpNpgKeT579o63MrG4w_Z92CSWMo"

# Cabeçalhos de segurança do site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # 2 anos, valendo também para subdomínios. Sem "preload" de propósito (o registro na lista é difícil de desfazer).
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # Isola a janela do site de outras origens (anti Spectre/ataques por window.opener) e impede que outros sites incorporem os arquivos daqui.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Só carrega do próprio site, do Supabase (dados, login, tempo real), da BrasilAPI (busca de CNPJ) e das fontes do Google.
    # Sem frames, sem workers e sem plugins; conexões http viram https.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://sirhttnpwcoptezpxneb.supabase.co wss://sirhttnpwcoptezpxneb.supabase.co https://brasilapi.com.br; manifest-src 'self'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# A página inicial nunca fica presa no cache: uma correção de segurança chega a todo mundo na hora.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
